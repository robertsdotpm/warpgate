[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warpgate"
version = "4.0.12"
description = "Any peer, any NAT — one-shot Python NAT traversal: 8-plugin cascade, IPv4 + IPv6, multi-NIC, zero infrastructure to run."
readme = "README.md"
requires-python = ">=3.5"
license = {text = "public domain"}
authors = [
    {name = "Matthew Roberts", email = "matthew@roberts.pm"}
]
keywords = [
    "NAT traversal", "hole punching", "TCP hole punching", "UDP hole punching",
    "simultaneous open", "STUN", "TURN", "ICE", "UPnP", "NAT-PMP", "PCP",
    "P2P", "peer-to-peer", "decentralized", "rendezvous", "WebRTC alternative",
    "asyncio", "async networking", "IPv6", "multi-NIC", "cross-platform",
    "Windows XP", "self-hosted", "serverless networking",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = [
    "aionetiface",
    "namebump",
    "sidewire",
    "ecdsa",
]

[project.urls]
Homepage = "https://www.warpgate.io/"
Repository = "https://github.com/robertsdotpm/p2pd"
Documentation = "https://www.warpgate.io/"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "network: tests that require live network connectivity (stun, turn, pnp, etc.)",
]
